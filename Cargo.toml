[package]
name = "gannet"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A lightweight package manager for GitHub release binaries"
repository = "https://github.com/planesailingio/gannet"
authors = ["Rhys Evans"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", features = ["json"] }
flate2 = "1.1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
dirs = "6.0"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
